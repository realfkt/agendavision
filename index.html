<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendavision - Reserva tu Hora</title>
  <style>
    /* ===== VARIABLES PROFESIONALES ===== */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #14b8a7;
      --bg-light: #f8f9fa;
      --card-bg: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --danger: #ef4444;
    }

    /* ===== BASE ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-light); color: var(--text); line-height: 1.5; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: var(--primary-hover); }

    /* ===== MODAL RESERVA (POPUP) ===== */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; }
    .modal { width: 90%; max-width: 520px; background: var(--card-bg); border-radius: 16px; padding: 40px 30px; position: relative; }
    .modal h2 { color: var(--primary); margin-top: 0; margin-bottom: 10px; font-size: 24px; }
    .modal .close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; background: #eee; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #666; }
    .modal h3 { margin: 10px 0 20px; font-size: 18px; }
    .modal p { color: var(--muted); margin-bottom: 20px; font-size: 14px; }

    /* ===== FORMULARIO MÍNIMO ===== */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
    .form-group small { color: var(--muted); font-size: 12px; display: block; margin-top: 4px; }

    /* ===== HORAS DISPONIBLES (GRID) ===== */
    .horas-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .hora-btn { padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .hora-btn:hover { background: #f1f5f9; }
    .hora-btn.seleccionado { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ===== RESUMEN / CONFIRMACIÓN ===== */
    .resumen { background: #f1f5f9; padding: 20px; border-radius: 10px; margin-top: 20px; display: none; }
    .resumen h3 { margin-top: 0; color: var(--primary); font-size: 18px; }
    .resumen p { margin: 8px 0; font-size: 14px; }
    .resumen .costos { font-weight: bold; color: var(--danger); }

    /* ===== BOTONES ===== */
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 10px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #64748b; color: #fff; margin-top: 10px; }
    .btn-danger { background: var(--danger); color: #fff; width: 100%; }

    /* ===== NAVEGACIÓN INTERNA ===== */
    .step { display: none; }
    .step.activo { display: block; }
    .nav-links { margin-top: 20px; display: flex; gap: 10px; }
    .nav-links a { padding: 8px 14px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; color: var(--text); }
    .nav-links a.activo { background: var(--primary); color: #fff; }
    </style>
  </head>
  <body>

    <!-- Modal de Reserva (Popup) -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" id="modal-reserva">
        <span class="close" onclick="ocertarModal()">&times;</span>
        <h2>Agendavision</h2>
        <p>Reserva tu hora para examen visual</p>

        <form id="form-reserva" class="formulario">
          <!-- PASO 1: DATOS DEL SOLICITANTE -->
          <div class="step activo" id="step-datos">
            <h3>Datos del solicitante</h3>
            <div class="form-group">
              <label>Nombre completo</label>
              <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
              <label>Teléfono (WhatsApp)</label>
              <input type="tel" id="telefono" required>
            </div>
            <div class="form-group">
              <label>Correo electrónico</label>
              <input type="email" id="correo">
            </div>
          </div>

          <!-- PASO 2: SERVICIO Y FECHA -->
          <div class="step" id="step-servicio">
            <h3>Servicio y fecha</h3>
            <p>Selecciona el servicio, fecha y hora disponible:</p>
            <div class="form-group">
              <label>Servicio</label>
              <select id="servicio-select" disabled>
                <option value="Examen Visual Adulto - Fonasa">Examen Visual Adulto - Fonasa</option>
                <option value="Examen Visual Adulto - Isapre">Examen Visual Adulto - Isapre</option>
                <option value="Compra de lentes">Compra de lentes</option>
              </select>
            </div>
            <div class="form-group">
              <label>Fecha de la consulta</label>
              <input type="date" id="fecha-consulta" min="2026-11-27" required>
            </div>
            <div class="form-group">
              <label>Horario disponible</label>
              <div class="horas-grid" id="horas-grid">
                <button class="hora-btn" data-hora="09:00">9:00</button>
                <button class="hora-btn" data-hora="10:30">10:30</button>
                <button class="hora-btn" data-hora="14:00">14:00</button>
                <button class="hora-btn" data-hora="15:30">15:30</button>
              </div>
            </div>
          </div>

          <!-- PASO 3: RESUMEN -->
          <div class="step" id="step-resumen" style="display: none;">
            <h3>Confirmación de reserva</h3>
            <div class="resumen" id="resumen-contenido">
              <p><strong>Servicio:</strong> <span id="nom-servicio"></span></p>
              <p><strong>Fecha y hora:</strong> <span id="fecha-hora-seleccionada"></span></p>
              <p><strong>Solicitante:</strong> <span id="datos-cliente"></span></p>
              <p class="costos"><strong>Costo:</strong> <span id="costo-total">$6.600</span></p>
            </div>
            <div style="margin-top: 20px; display: flex; justify-content: flex-end;">
              <button onclick="whatsappEnviar()" class="btn btn-danger">Enviar por WhatsApp</button>
              <button onclick="ocertarModal()" class="btn btn-secondary">Atrás</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script>
      // ===== ESTADO INTERNO =====
      let pasoActual = 1;
      const pasos = [1, 2, 3];

      // ===== ELEMENTOS DEL DOM =====
      const modal = documento.getElementById('modal-reserva');
      const modalOverlay = documento.getElementById('modal-overlay');
      const formulario = documento.getElementById('form-reserva');
      const stepDatos = documento.getElementById('step-datos');
      const stepServicio = documento.getElementById('step-servicio');
      const stepResumen = documento.getElementById('step-resumen');
      const nomServicio = documento.getElementById('nom-servicio');
      const fechaHoraSel = documento.getElementById('fecha-hora-seleccionada');
      const datosCliente = documento.getElementById('datos-cliente');
      const costoTotal = documento.getElementById('costo-total');

      // ===== ABRIR MODAL =====
      funcion abrirModal() {
        modal.style.display = 'flex';
        modalOverlay.style.display = 'flex';
        pasoActual = 1;
        actualizarPasos();
      }

      funcion ocertarModal() {
        modal.style.display = 'none';
        modalOverlay.style.display = 'none';
        formulario.reset();
        pasoActual = 1;
        actualizarPasos();
      }

      // ===== NAVEGAR PASOS =====
      funcion siguiente() {
        if (pasoActual < 3) {
          pasoActual++;
          actualizarPasos();
        }
      }

      funcion anterior() {
        if (pasoActual > 1) {
          pasoActual--;
          actualizarPasos();
        }
      }

      funcion actualizarPasos() {
        pasoActual = Math.max(1, Math.min(3, pasoActual));
        [stepDatos, stepServicio, stepResumen].forEach((s, i) => {
          s.classList.toggle('activo', i + 1 === pasoActual);
        });
        documento.querySelectorAll('.nav-links a')[pasoActual - 1].classList.add('activo');
      }

      // ===== SELECCIÓN DE HORA =====
      function seleccionarHora(btn) {
        documento.querySelectorAll('.hora-btn').forEach(b => b.classList.remove('seleccionado'));
        btn.classList.add('seleccionado');
      }

      // Eventos: HORAS
      documento.querySelectorAll('.hora-btn').forEach(b => {
        b.addEventListener('click', function() {
          seleccionarHora(this);
        });
      });

      // ===== ENVIAR FORMULARIO =====
      formulario.addEventListener('submit', funcion(e) {
        e.preventDefault();
        
        const nombre = documento.getElementById('nombre').value.trim();
        const telefono = documento.getElementById('telefono').value.trim();
        const correo = documento.getElementById('correo').value.trim();
        const fecha = documento.getElementById('fecha-consulta').value;
        const horaSeleccionada = documento.querySelector('.hora-btn.seleccionado')?.dataset.hora || '09:00';
        const servicio = documento.getElementById('servicio-select').value;

        // Validación simple
        if (!nombre || !telefono) {
          alert('Por favor completa los campos obligatorios: nombre y teléfono.');
          return;
        }

        // Mostrar paso de resumen
        pasoActual = 3;
        actualizarPasos();

        nomServicio.textContent = servicio;
        fechaHoraSel.textContent = `${documento.getElementById('fecha-consulta').value} a las ${horaSeleccionada} am`;
        datosCliente.textContent = `${nombre} - Tel: ${telefono}`;
        costoTotal.textContent = '$6.600';

        // Enfocar en el resumen
        pasoActual = 3;
        actualizarPasos();
      });

      // ===== WHATSAPP =====
      funcion whatsappEnviar() {
        const nombre = documento.getElementById('nombre').value.trim();
        const telefono = documento.getElementById('telefono').value.trim();
        const fechaSel = documento.getElementById('fecha-consulta').value;
        const horaSel = documento.querySelector('.hora-btn.seleccionado')?.dataset.hora || '09:00';
        const mensaje = `Hola, nueva solicitud de reserva: ${nombre} quiere hora para Examen Visual Adulto - Fonasa. Fecha: ${fechaSel} a las ${horaSel} am. Tel: ${telefono}`;
        ventana.abrir(`https://wa.me/569XXXXXXXX?text=${encodeURIComponent(mensaje)}`, '_blank');
        ocertarModal();
      }

      // ===== EVENTOS INICIALES =====
      // Simular apertura al cargar (quitaría en producción real o al hacer click en botón external)
      documento.addEventListener('DOMContentLoaded', abrirModal);

      // Navegación entre pasos (simulada con enlaces invisibles en HTML, aquí usamos los pasos del form)
      documento.querySelectorAll('.nav-links a').forEach(a => {
        a.addEventListener('click', function(e) {
          e.preventDefault();
          anterior();
        });
      });
    </script>
  </body>
</html>
